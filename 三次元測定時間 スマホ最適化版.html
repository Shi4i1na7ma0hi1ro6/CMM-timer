<div class="container">
    <h1>三次元測定時間</h1>
    
    <div class="today-summary-box">

    </div>
    
    <div style="display: flex; gap: 10px; margin-bottom: 14px; position: relative; z-index: 1;">
        <button class="btn-download" onclick="downloadCSV()">CSV形式でダウンロード</button>
        <button class="btn-clear" onclick="clearAllRecords()">全データ一括削除</button>
    </div>

    <div class="form-section">
        <div class="form-group">
            <label for="品目">品目</label>
            <select id="品目"></select>
            <div class="master-add-container">
                <input type="text" id="新規品目" placeholder="新品目を入力">
                <button type="button" onclick="addHinmokuMaster()">追加</button>
            </div>
        </div>

        <div class="form-group">
            <label for="品番">品番</label>
            <select id="品番"></select>
            <div class="master-add-container">
                <input type="text" id="新規品番" placeholder="新品番を入力">
                <button type="button" onclick="addHinbanMaster()">追加</button>
            </div>
        </div>
        
        <div class="form-group">
            <label>指図番号 (前半プル / 後半入力)</label>
            <div class="sashizu-container">
                <select id="指図番号_前半"></select>
                <input type="text" id="指図番号_後半" placeholder="後半部">
            </div>
            <div class="master-add-container">
                <input type="text" id="新規マスタ値" placeholder="新コード(例: 1S260)">
                <button type="button" onclick="addSashizuMaster()">前半追加</button>
            </div>
        </div>

        <div class="form-group">
            <label for="機械">機械 (分/個)</label>
            <input type="text" id="機械" placeholder="例: 11" list="機械マスタ">
            <datalist id="機械マスタ">
                <option value="11"></option>
                <option value="5"></option>
                <option value="4"></option>
                <option value="7"></option>
                <option value="2"></option>
                <option value="1"></option>
                <option value="手動"></option>
                <option value="校正"></option>
            </datalist>
        </div>

        <div class="timer-section">
            <div class="timer-header">
                <div style="color: #94a3b8; font-size: 14px; font-weight: bold;">リアルタイム時間計測カウンター</div>
                <div class="timer-status-badge" id="timerStatusBadge">状態: 停止中</div>
            </div>
            
            <div class="timer-counters-wrapper">
                <div class="counter-box">
                    <div class="counter-label">❶ 段取り時間</div>
                    <div class="counter-time-milli" id="dandoriSecondsDisplay">0秒</div>
                    <div class="counter-approx-min" id="dandoriMinutesDisplay">約 0.0 分</div>
                </div>
                <div class="counter-box">
                    <div class="counter-label">❷ 作業時間</div>
                    <div class="counter-time-milli" id="workSecondsDisplay">0秒</div>

            <div class="timer-buttons">

                <button type="button" class="btn-start-work" id="btnWork" onclick="toggleWork()">❷ 作業開始</button>

        </div>

<script>
    // エラーハンドラー（不具合を画面に可視化）
    window.onerror = function(msg, url, line) {
        const logBox = document.getElementById('systemLog');
        if(logBox) {
            logBox.style.display = 'block';
            logBox.innerHTML += `<div>エラー検知: ${msg} (行: ${line})</div>`;
        }
        return false;
    };

    let records = [];
    
    const defaultHinmoku = [
        "選択してください",

        "ワーク品"
    ];

    const defaultHinban = [
        "選択してください",
        "G003128",
        "BA00194",
        "B027487",
        "D006149",
        "D007250",
        "G003339",
        "AA05398",
        "AA05255",
        "G003357",
        "LDM048731",
        "LDM048732",
        "LDM050303"
    ];

    const defaultSashizu = [
        "選択してください",
        "1S260",
        "1S250",
        "K84530000"
    ];

    let hinmokuMasters = [...defaultHinmoku];
    let hinbanMasters = [...defaultHinban];
    let sashizuMasters = [...defaultSashizu];
    
    let timerDandori = { isRunning: false, accumulated: 0, lastStart: null };
    let timerWork = { isRunning: false, accumulated: 0, lastStart: null };
    let intervalId = null;

    let todayCombinedTotalMin = 0;

    // 安全にLocalStorageを読み書きする関数群（セキュリティ制限対応）
    function safeGetItem(key) {
        try {
            return localStorage.getItem(key);
        } catch(e) {
            return null;
        }
    }

    function safeSetItem(key, value) {
        try {
            localStorage.setItem(key, value);
        } catch(e) {
            // 保存失敗時はコンソールのみ記録し処理は継続
            console.warn("LocalStorage setItem failed:", e);
        }
    }

    function safeRemoveItem(key) {
        try {
            localStorage.removeItem(key);
        } catch(e) {}
    }

    // 計測中の画面スリープ防止（対応端末のみ）
    let wakeLock = null;
    async function acquireWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (e) { /* 非対応や許可拒否時は無視 */ }
    }
    function releaseWakeLockIfIdle() {
        if (!timerDandori.isRunning && !timerWork.isRunning && wakeLock) {
            wakeLock.release().catch(()=>{});
            wakeLock = null;
        }
    }
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && (timerDandori.isRunning || timerWork.isRunning)) {
            acquireWakeLock();
        }
    });

    window.onload = function() {
        // マスタ読込（ガード付き）
        const mHinmoku = safeGetItem('hinmoku_m_v6');
        const mHinban = safeGetItem('hinban_m_v6');
        const mSashizu = safeGetItem('sashizu_m_v6');

        if (mHinmoku) hinmokuMasters = JSON.parse(mHinmoku);
        if (mHinban) hinbanMasters = JSON.parse(mHinban);
        if (mSashizu) sashizuMasters = JSON.parse(mSashizu);
        
        renderSelect('品目', hinmokuMasters);
        renderSelect('品番', hinbanMasters);
        renderSelect('指図番号_前半', sashizuMasters);

        // 記録表の復元
        const savedRecords = safeGetItem('records_v6');
        if (savedRecords) {
            records = JSON.parse(savedRecords);
            renderTable();
        }

        // 合計時間復元
        const storedTotal = safeGetItem('total_combined_v6');
        todayCombinedTotalMin = storedTotal ? parseInt(storedTotal) : 0;
        updateTodaySummaryDisplay();

        updateTimerDisplay();
    };

    function renderSelect(elementId, dataArray) {
        const select = document.getElementById(elementId);
        if(!select) return;
        select.innerHTML = '';
        dataArray.forEach(val => {
            const opt = document.createElement('option');
            opt.value = val === "選択してください" ? "" : val;
            opt.textContent = val;
            select.appendChild(opt);
        });
    }

    function addHinmokuMaster() {
        const input = document.getElementById('新規品目');
        const val = input.value.trim();
        if (!val) return;
        if (!hinmokuMasters.includes(val)) {
            hinmokuMasters.push(val);
            safeSetItem('hinmoku_m_v6', JSON.stringify(hinmokuMasters));
            renderSelect('品目', hinmokuMasters);
            document.getElementById('品目').value = val;
            input.value = '';
        } else { showToast('既に存在します。'); }
    }

    function addHinbanMaster() {
        const input = document.getElementById('新規品番');
        const val = input.value.trim();
        if (!val) return;
        if (!hinbanMasters.includes(val)) {
            hinbanMasters.push(val);
            safeSetItem('hinban_m_v6', JSON.stringify(hinbanMasters));
            renderSelect('品番', hinbanMasters);
            document.getElementById('品番').value = val;
            input.value = '';
        } else { showToast('既に存在します。'); }
    }

    function addSashizuMaster() {
        const input = document.getElementById('新規マスタ値');
        const val = input.value.trim();
        if (!val) return;
        if (!sashizuMasters.includes(val)) {
            sashizuMasters.push(val);
            safeSetItem('sashizu_m_v6', JSON.stringify(sashizuMasters));
            renderSelect('指図番号_前半', sashizuMasters);
            document.getElementById('指図番号_前半').value = val;
            input.value = '';
        } else { showToast('既に存在します。'); }
    }

    function roundBy30Seconds(totalMilli) {
        const totalSeconds = totalMilli / 1000;
        const minutes = Math.floor(totalSeconds / 60);
        const remainingSeconds = totalSeconds % 60;
        return remainingSeconds >= 30 ? minutes + 1 : minutes;
    }

    function toggleDandori() {
        const now = new Date();
        const btn = document.getElementById('btnDandori');

        if (!timerDandori.isRunning) {
            timerDandori.isRunning = true;
            timerDandori.lastStart = now;
            btn.innerHTML = '⏸ 段取り一時停止';
            btn.className = 'btn-start-dandori paused';
            document.getElementById('btnComplete').disabled = false;
            startIntervalLoop();
            acquireWakeLock();
        } else {
            timerDandori.isRunning = false;
            timerDandori.accumulated += (now - timerDandori.lastStart);
            btn.innerHTML = '▶ 段取り再開';
            btn.className = 'btn-start-dandori';
            checkIntervalStatus();
            releaseWakeLockIfIdle();
        }
        updateBadgeStatus();
    }

    function toggleWork() {
        const now = new Date();
        const btn = document.getElementById('btnWork');

        if (!timerWork.isRunning) {
            timerWork.isRunning = true;
            timerWork.lastStart = now;
            btn.innerHTML = '⏸ 作業一時停止';
            btn.className = 'btn-start-work paused';
            document.getElementById('btnComplete').disabled = false;
            startIntervalLoop();
            acquireWakeLock();
        } else {
            timerWork.isRunning = false;
            timerWork.accumulated += (now - timerWork.lastStart);
            btn.innerHTML = '▶ 作業再開';
            btn.className = 'btn-start-work';
            checkIntervalStatus();
            releaseWakeLockIfIdle();
        }
        updateBadgeStatus();
    }

    function startIntervalLoop() {
        if (!intervalId) {
            intervalId = setInterval(() => { updateTimerDisplay(); }, 200);
        }
    }

    function checkIntervalStatus() {
        if (!timerDandori.isRunning && !timerWork.isRunning) {
            clearInterval(intervalId);
            intervalId = null;
            updateTimerDisplay();
        }
    }

    function updateBadgeStatus() {
        const badge = document.getElementById('timerStatusBadge');
        if (!badge) return;
        if (timerDandori.isRunning && timerWork.isRunning) {
            badge.innerHTML = '状態: 段取り＆作業 同時計測中';
            badge.className = 'timer-status-badge active';
        } else if (timerDandori.isRunning) {
            badge.innerHTML = '状態: 段取り計測中';
            badge.className = 'timer-status-badge active';
        } else if (timerWork.isRunning) {
            badge.innerHTML = '状態: 作業計測中';
            badge.className = 'timer-status-badge active';
        } else if (timerDandori.accumulated > 0 || timerWork.accumulated > 0) {
            badge.innerHTML = '状態: 一時停止中';
            badge.className = 'timer-status-badge';
        } else {
            badge.innerHTML = '状態: 停止中';
            badge.className = 'timer-status-badge';
        }
    }

    function updateTimerDisplay() {
        const now = new Date();
        let dispDandori = timerDandori.accumulated;
        let dispWork = timerWork.accumulated;

        if (timerDandori.isRunning) dispDandori += (now - timerDandori.lastStart);
        if (timerWork.isRunning) dispWork += (now - timerWork.lastStart);

        const secDandori = Math.floor(dispDandori / 1000);
        const secWork = Math.floor(dispWork / 1000);

        const dSec = document.getElementById('dandoriSecondsDisplay');
        const dMin = document.getElementById('dandoriMinutesDisplay');
        const wSec = document.getElementById('workSecondsDisplay');
        const wMin = document.getElementById('workMinutesDisplay');

        if(dSec) dSec.textContent = `${secDandori}秒`;
        if(dMin) dMin.textContent = `約 ${(secDandori / 60).toFixed(1)} 分`;
        if(wSec) wSec.textContent = `${secWork}秒`;
        if(wMin) wMin.textContent = `約 ${(secWork / 60).toFixed(1)} 分`;
    }

    function completeAll() {
        const now = new Date();
        if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
        }
        if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }

        if (timerDandori.isRunning) timerDandori.accumulated += (now - timerDandori.lastStart);
        if (timerWork.isRunning) timerWork.accumulated += (now - timerWork.lastStart);

        const finalDandoriMin = roundBy30Seconds(timerDandori.accumulated);
        const finalWorkMin = roundBy30Seconds(timerWork.accumulated);

        document.getElementById('段取り').value = finalDandoriMin;
        document.getElementById('作業').value = finalWorkMin;

        todayCombinedTotalMin += (finalDandoriMin + finalWorkMin);
        safeSetItem('total_combined_v6', todayCombinedTotalMin);
        updateTodaySummaryDisplay();

        timerDandori = { isRunning: false, accumulated: 0, lastStart: null };
        timerWork = { isRunning: false, accumulated: 0, lastStart: null };

        document.getElementById('btnDandori').innerHTML = '❶ 段取り開始';
        document.getElementById('btnDandori').className = 'btn-start-dandori';
        document.getElementById('btnWork').innerHTML = '❷ 作業開始';
        document.getElementById('btnWork').className = 'btn-start-work';
        document.getElementById('btnComplete').disabled = true;
        
        updateBadgeStatus();
        updateTimerDisplay();
    }

    function updateTodaySummaryDisplay() {
        const view = document.getElementById('totalCombinedView');
        if(view) view.textContent = todayCombinedTotalMin;
    }

    function addRecord() {
        const hinmoku = document.getElementById('品目').value;
        const hinban = document.getElementById('品番').value;
        
        const mae = document.getElementById('指図番号_前半').value;
        const ushiro = document.getElementById('指図番号_後半').value;
        const sashizu = mae + ushiro; 

        const dandori = parseInt(document.getElementById('段取り').value) || 0;
        const sagyo = parseInt(document.getElementById('作業').value) || 0;
        const kikai = document.getElementById('機械').value;

        const newRecord = { hinmoku, hinban, sashizu, dandori, sagyo, kikai };
        records.push(newRecord);
        
        safeSetItem('records_v6', JSON.stringify(records));
        renderTable();

        document.getElementById('品目').value = '';
        document.getElementById('品番').value = '';
        document.getElementById('指図番号_後半').value = '';
        document.getElementById('段取り').value = '0';
        document.getElementById('作業').value = '0';
        document.getElementById('機械').value = '';
    }

    function renderTable() {
        const tbody = document.getElementById('recordBody');
        if(!tbody) return;
        tbody.innerHTML = '';

        records.forEach((rec, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${escapeHtml(rec.hinmoku)}</td>
                <td>${escapeHtml(rec.hinban)}</td>
                <td>${escapeHtml(rec.sashizu)}</td>
                <td>${rec.dandori}</td>
                <td>${rec.sagyo}</td>
                <td>${escapeHtml(rec.kikai)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function showToast(message) {
        let toast = document.getElementById('customToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'customToast';
            toast.style.position = 'fixed';
            toast.style.bottom = 'calc(24px + env(safe-area-inset-bottom))';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = '#1e293b';
            toast.style.color = '#fff';
            toast.style.padding = '12px 20px';
            toast.style.borderRadius = '8px';
            toast.style.fontSize = '14px';
            toast.style.zIndex = '999';
            toast.style.boxShadow = '0 4px 10px rgba(0,0,0,0.3)';
            toast.style.maxWidth = '90vw';
            toast.style.textAlign = 'center';
            document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.style.display = 'block';
        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function showConfirmDialog(message, onConfirm) {
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.inset = '0';
        overlay.style.background = 'rgba(0,0,0,0.5)';
        overlay.style.display = 'flex';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.zIndex = '1000';
        overlay.style.padding = '20px';

        const box = document.createElement('div');
        box.style.background = '#fff';
        box.style.borderRadius = '10px';
        box.style.padding = '20px';
        box.style.maxWidth = '90vw';
        box.style.boxSizing = 'border-box';
        box.style.textAlign = 'center';

        const msg = document.createElement('div');
        msg.style.fontSize = '14px';
        msg.style.color = '#333';
        msg.style.marginBottom = '16px';
        msg.style.whiteSpace = 'pre-line';
        msg.textContent = message;

        const btnRow = document.createElement('div');
        btnRow.style.display = 'flex';
        btnRow.style.gap = '10px';

        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = 'キャンセル';
        cancelBtn.style.flex = '1';
        cancelBtn.style.background = '#718096';
        cancelBtn.style.color = '#fff';
        cancelBtn.style.padding = '12px';
        cancelBtn.style.border = 'none';
        cancelBtn.style.borderRadius = '6px';
        cancelBtn.onclick = () => document.body.removeChild(overlay);

        const okBtn = document.createElement('button');
        okBtn.textContent = '実行する';
        okBtn.style.flex = '1';
        okBtn.style.background = '#dc2626';
        okBtn.style.color = '#fff';
        okBtn.style.padding = '12px';
        okBtn.style.border = 'none';
        okBtn.style.borderRadius = '6px';
        okBtn.onclick = () => {
            document.body.removeChild(overlay);
            onConfirm();
        };

        btnRow.appendChild(cancelBtn);
        btnRow.appendChild(okBtn);
        box.appendChild(msg);
        box.appendChild(btnRow);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
    }

    function clearAllRecords() {
        showConfirmDialog('表示されている記録プレビュー、および「本日の三次元測定時間」の合計カウンターをすべてリセットしますか？\n（※登録したマスタ選択肢は消えずに残ります）', () => {
            records = [];
            todayCombinedTotalMin = 0;
            
            safeRemoveItem('records_v6');
            safeRemoveItem('total_combined_v6');
            
            renderTable();
            updateTodaySummaryDisplay();
            showToast('削除しました。');
        });
    }

    function downloadCSV() {
        if (records.length === 0) {
            showToast('ダウンロードするデータがありません。');
            return;
        }

        let csvContent = "\uFEFF"; 
        csvContent += "No,品目 ,品番,指図番号,段取り(分),作業(分),機械(分/個)\r\n";

        records.forEach((rec, index) => {
            let row = [
                index + 1,
                `"${(rec.hinmoku || '').replace(/"/g, '""')}"`,
                `"${(rec.hinban || '').replace(/"/g, '""')}"`,
                `"${(rec.sashizu || '').replace(/"/g, '""')}"`, 
                rec.dandori,
                rec.sagyo,
                `"${(rec.kikai || '').replace(/"/g, '""')}"`
            ];
            csvContent += row.join(",") + "\r\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
        const filename = `三次元測定_作業記録_${today}.csv`;

        try {
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('CSVをダウンロードしました。');
        } catch (e) {
            // iOS Safari/WebViewでダウンロード属性が無効な場合のフォールバック
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            showToast('CSVを新しいタブで開きました。共有ボタンから保存してください。');
        }
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
</script>
